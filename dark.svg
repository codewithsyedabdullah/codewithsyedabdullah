      .particle1 { animation:float-p1 5s infinite ease-in-out; }
      .particle2 { animation:float-p2 7s infinite ease-in-out; }
      .cmd-line1 { animation:type-cmd1 20s infinite; overflow:hidden; display:inline-block; }
      .out-line1 { animation:show-out1 20s infinite; }
      .out-line2 { animation:show-out2 20s infinite; }
      .cmd-line2 { animation:type-cmd2 20s infinite; overflow:hidden; display:inline-block; }
      .out-line3 { animation:show-out3 20s infinite; }
      .out-line4 { animation:show-out4 20s infinite; }
      .cmd-line3 { animation:type-cmd3 20s infinite; overflow:hidden; display:inline-block; }
      .out-line5 { animation:show-out5 20s infinite; }
      .cmd-line4 { animation:type-cmd4 20s infinite; overflow:hidden; display:inline-block; }
      .out-line6 { animation:show-out6 20s infinite; }
      .cmd-line5 { animation:type-cmd5 20s infinite; overflow:hidden; display:inline-block; }
      .out-line7 { animation:show-out7 20s infinite; }
      .cmd-line6 { animation:type-cmd6 20s infinite; overflow:hidden; display:inline-block; }
