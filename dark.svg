      text { font-family: 'Fira Code', 'Courier New', monospace; }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
      @keyframes scan { 0% { transform:translateY(0); } 50% { transform:translateY(540px); } 100% { transform:translateY(0); } }
      @keyframes pulse-border { 0%,100% { stroke-opacity:0.3; filter:drop-shadow(0 0 2px rgba(0,229,255,0.2)); } 50% { stroke-opacity:0.8; filter:drop-shadow(0 0 8px rgba(0,229,255,0.6)); } }
      @keyframes float-p1 { 0%,100% { transform:translate(0,0); opacity:0.2; } 50% { transform:translate(10px,-20px); opacity:0.7; } }
      @keyframes float-p2 { 0%,100% { transform:translate(0,0); opacity:0.3; } 50% { transform:translate(-15px,-15px); opacity:0.8; } }
