      @keyframes type-cmd1 { 0%,5% { width:0; } 9%,100% { width:200px; } }
      @keyframes show-out1 { 0%,10% { opacity:0; } 11%,100% { opacity:1; } }
      @keyframes show-out2 { 0%,12% { opacity:0; } 13%,100% { opacity:1; } }
      @keyframes type-cmd2 { 0%,15% { width:0; } 19%,100% { width:200px; } }
      @keyframes show-out3 { 0%,21% { opacity:0; } 22%,100% { opacity:1; } }
      @keyframes show-out4 { 0%,23% { opacity:0; } 24%,100% { opacity:1; } }
      @keyframes type-cmd3 { 0%,26% { width:0; } 30%,100% { width:200px; } }
      @keyframes show-out5 { 0%,32% { opacity:0; } 33%,100% { opacity:1; } }
      @keyframes type-cmd4 { 0%,35% { width:0; } 39%,100% { width:200px; } }
      @keyframes show-out6 { 0%,41% { opacity:0; } 42%,100% { opacity:1; } }
      @keyframes type-cmd5 { 0%,44% { width:0; } 48%,100% { width:200px; } }
      @keyframes show-out7 { 0%,50% { opacity:0; } 51%,100% { opacity:1; } }
      @keyframes type-cmd6 { 0%,53% { width:0; } 57%,100% { width:200px; } }
      @keyframes show-out8 { 0%,59% { opacity:0; } 60%,100% { opacity:1; } }
      @keyframes type-cmd7 { 0%,62% { width:0; } 66%,100% { width:200px; } }
